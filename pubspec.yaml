name: loan_chit_manager
description: Offline loan and chit-fund manager for small lenders.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  intl: '>=0.19.0 <0.21.0'
  url_launcher: ^6.3.0
  crypto: ^3.0.3
  local_auth: ^2.3.0
  file_picker: ^10.3.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
